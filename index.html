<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible TODO App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header>
    <h1>My TODO List</h1>
  </header>

  <main id="main">
    <form id="todo-form" class="todo-form" autocomplete="off">
      <label for="todo-input">Add a new task</label>
      <div class="todo-form__row">
        <input
          type="text"
          id="todo-input"
          name="todo"
          placeholder="e.g. Buy groceries"
          aria-describedby="todo-input-help"
          required
        >
        <button type="submit">Add task</button>
      </div>
      <p id="todo-input-help" class="todo-form__help">
        Type a task and press Enter or select Add task.
      </p>
    </form>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">Tasks</h2>

      <p id="todo-status" class="todo-status" role="status" aria-live="polite"></p>

      <ul id="todo-list" class="todo-list" aria-labelledby="list-heading"></ul>

      <p id="empty-message" class="empty-message">You have no tasks yet. Add one above.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
